springdoc:
  paths-to-match: /api/**
  swagger-ui:
    operations-sorter: alpha
spring:
  application:
    name: shopping-agent-ai
  profiles:
    default: dev
  datasource:
    url: jdbc:mysql://localhost:3306/shopping_mall
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        model: deepseek-v4-flash
        temperature: 0.2
      embedding:
        api-key: ${QWEN_EMBEDDING_API_KEY:}
        base-url: https://ws-xppsn0j6du7g1eu4.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
        model: qwen3.7-text-embedding
    vectorstore:
      milvus:
        client:
          host: "localhost"
          port: 19530
          username: "root"
          password: "milvus"
        database-name: "default"
        collection-name: "phone_knowledge_1024"
        embedding-dimension: 1024
        initialize-schema: true
        metric-type: COSINE
  security:
    jwt:
      key: 'abcdefghijklmn'
      expire: 72
      limit:
        base: 10
        upgrade: 300
        frequency: 30
    filter:
      order: -100
app:
  order:
    payment-timeout: 30m
    close-scan-delay: 1m
    draft-ttl: 10m
